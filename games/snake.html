<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  :root { --cell: 20px; --grid: 24; }
  html, body {
    margin: 0; height: 100%;
    background: #0d1117; color: #c9d1d9;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none;
  }
  h1 { font-weight: 600; letter-spacing: 4px; margin: 0 0 8px; color: #58d68d; }
  #hud { display: flex; gap: 24px; margin-bottom: 10px; font-size: 14px; opacity: .85; }
  #hud b { color: #58d68d; }
  canvas {
    background: #010409;
    border: 1px solid #30363d; border-radius: 8px;
    box-shadow: 0 0 40px rgba(88,214,141,.12);
  }
  #msg {
    position: relative; margin-top: -210px; height: 0;
    text-align: center; pointer-events: none;
  }
  #msg span {
    display: inline-block; background: rgba(13,17,23,.92);
    border: 1px solid #30363d; border-radius: 8px; padding: 16px 22px;
    font-size: 15px; line-height: 1.6; color: #c9d1d9;
  }
  #msg b { color: #58d68d; }
  .hide { display: none !important; }
  small { opacity: .55; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="hud"><div>score <b id="score">0</b></div><div>best <b id="best">0</b></div></div>
  <canvas id="board" width="480" height="480"></canvas>
  <div id="msg"><span id="msgtext"></span></div>
  <small>arrow keys / WASD &nbsp;·&nbsp; space or click to (re)start</small>

<script>
(() => {
  const CELL = 20, GRID = 24;            // 480 / 20
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const msg     = document.getElementById('msg');
  const msgText = document.getElementById('msgtext');

  let snake, dir, nextDir, food, score, best = 0, alive, started, tickMs, acc, last;

  function reset() {
    snake = [{x: 8, y: 12}, {x: 7, y: 12}, {x: 6, y: 12}];
    dir = {x: 1, y: 0}; nextDir = {x: 1, y: 0};
    score = 0; alive = true; started = false; tickMs = 110; acc = 0; last = 0;
    placeFood();
    scoreEl.textContent = '0';
    showMsg('<b>SNAKE</b><br>press an arrow key to start');
    draw();
  }

  function placeFood() {
    while (true) {
      const f = {x: (Math.random() * GRID) | 0, y: (Math.random() * GRID) | 0};
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function showMsg(html) { msgText.innerHTML = html; msg.classList.remove('hide'); }
  function hideMsg() { msg.classList.add('hide'); }

  function step() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // wall or self collision -> game over
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      alive = false;
      best = Math.max(best, score); bestEl.textContent = best;
      showMsg(`<b>game over</b><br>score ${score}<br><small>space / click to play again</small>`);
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++; scoreEl.textContent = score;
      if (tickMs > 60) tickMs -= 2;          // speed up a touch each bite
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = '#010409';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // food
    ctx.fillStyle = '#f85149';
    roundRect(food.x * CELL, food.y * CELL, CELL, CELL, 5);
    // snake
    for (let i = 0; i < snake.length; i++) {
      ctx.fillStyle = i === 0 ? '#58d68d' : '#2ea043';
      roundRect(snake[i].x * CELL + 1, snake[i].y * CELL + 1, CELL - 2, CELL - 2, 4);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  }

  function loop(ts) {
    if (last) acc += ts - last;
    last = ts;
    if (alive && started && acc >= tickMs) { acc = 0; step(); }
    draw();
    requestAnimationFrame(loop);
  }

  const DIRS = {
    ArrowUp: {x: 0, y: -1}, ArrowDown: {x: 0, y: 1},
    ArrowLeft: {x: -1, y: 0}, ArrowRight: {x: 1, y: 0},
    w: {x: 0, y: -1}, s: {x: 0, y: 1}, a: {x: -1, y: 0}, d: {x: 1, y: 0}
  };

  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') { if (!alive) reset(); e.preventDefault(); return; }
    const nd = DIRS[e.key];
    if (!nd) return;
    e.preventDefault();
    if (!alive) return;
    // ignore 180° reversals
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
    if (!started) { started = true; hideMsg(); }
  });

  canvas.addEventListener('click', () => { if (!alive) reset(); });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
