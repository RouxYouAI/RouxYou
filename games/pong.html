<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong Game</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #000;
  }
  canvas {
    border: 2px solid #fff;
  }
</style>
</head>
<body>
<canvas id="pongCanvas" width="800" height="400"></canvas>
<script>
const canvas = document.getElementById('pongCanvas');
const ctx = canvas.getContext('2d');

let leftPaddleY = canvas.height / 2 - 50;
let rightPaddleY = canvas.height / 2 - 50;
let ballX = canvas.width / 2;
let ballY = canvas.height / 2;
let ballSpeedX = 4;
let ballSpeedY = 4;
let leftScore = 0;
let rightScore = 0;

document.addEventListener('keydown', (e) => {
  if (e.key === 'w' && leftPaddleY > 0) {
    leftPaddleY -= 10;
  } else if (e.key === 's' && leftPaddleY < canvas.height - 100) {
    leftPaddleY += 10;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp' && rightPaddleY > 0) {
    rightPaddleY -= 10;
  } else if (e.key === 'ArrowDown' && rightPaddleY < canvas.height - 100) {
    rightPaddleY += 10;
  }
});

function drawRect(x, y, width, height, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, width, height);
}

function drawCircle(x, y, radius, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

function drawText(text, x, y, color) {
  ctx.fillStyle = color;
  ctx.font = '45px Arial';
  ctx.fillText(text, x, y);
}

function resetBall() {
  ballX = canvas.width / 2;
  ballY = canvas.height / 2;
  ballSpeedX = -ballSpeedX;
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawRect(0, leftPaddleY, 10, 100, '#fff');
  drawRect(canvas.width - 10, rightPaddleY, 10, 100, '#fff');

  ballX += ballSpeedX;
  ballY += ballSpeedY;

  if (ballY + 10 > canvas.height || ballY - 10 < 0) {
    ballSpeedY = -ballSpeedY;
  }

  if (ballX - 10 < 0) {
    rightScore++;
    resetBall();
  } else if (ballX + 10 > canvas.width) {
    leftScore++;
    resetBall();
  }

  if (ballX - 10 < 20 && ballY + 10 > leftPaddleY && ballY - 10 < leftPaddleY + 100) {
    ballSpeedX = -ballSpeedX;
  } else if (ballX + 10 > canvas.width - 30 && ballY + 10 > rightPaddleY && ballY - 10 < rightPaddleY + 100) {
    ballSpeedX = -ballSpeedX;
  }

  drawCircle(ballX, ballY, 10, '#fff');
  drawText(leftScore, canvas.width / 4, canvas.height / 5, '#fff');
  drawText(rightScore, 3 * canvas.width / 4, canvas.height / 5, '#fff');

  requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
